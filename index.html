<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SaladMaster - Սալաթների մենյու</title>
    <meta name="description" content="SaladMaster — թարմ և օգտակար սալաթների առաքում Երևանի տարածքում։" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        [x-cloak] {
            display: none !important;
        }

        * {
            scrollbar-width: none;
            touch-action: manipulation;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        html {
            overflow: -moz-scrollbars-none;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        section[x-show] {
            will-change: opacity, transform;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width:1023px) {
            .mobile-menu-fix {
                position: fixed;
                top: 68px;
                left: 0;
                right: 0;
                z-index: 39;
            }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { brand: { 50: "#eefaf0", 100: "#d7f3d8", 200: "#bfecc0", 300: "#a7e4a8", 400: "#8fe98f", 500: "#70e070", 600: "#4fb34f", 700: "#3a8b3a", 800: "#265826", 900: "#123412" } },
                    boxShadow: { neon: "0 10px 40px rgba(34,197,94,0.18)" },
                    backgroundImage: { "hero-gradient": "radial-gradient(circle at top, rgba(34,197,94,0.4), transparent 55%)" }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body class="text-slate-900 antialiased bg-gradient-to-br from-green-50 to-emerald-100 bg-fixed">
    <div x-data="shopApp" x-init="init()" class="min-h-screen">
        <div class="pointer-events-none fixed inset-0 bg-hero-gradient opacity-30"></div>

        <header class="sticky top-0 z-40 border-b border-emerald-200 bg-white/80 backdrop-blur">
            <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
                <div class="flex items-center gap-3">
                    <button class="flex justify-start items-start" @click="navigate('catalog')">
                        <div class="rounded-xl bg-gradient-to-r from-green-500 to-emerald-500 p-2">
                            <svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-xl w-max font-semibold tracking-tight text-green-700">SaladMaster</p>
                            <p class="text-xs w-max text-green-600">Թարմ եւ առողջ սալաթներ</p>
                        </div>
                    </button>
                </div>

                <nav class="hidden items-center gap-6 lg:flex">
                    <template x-for="item in navItems" :key="item.route">
                        <button class="text-sm font-medium tracking-wide uppercase"
                            :class="currentRoute === item.route ? 'text-green-600 text-3xl' : 'text-green-700'"
                            @click="navigate(item.route)">
                            <span x-text="item.label"></span>
                        </button>
                    </template>
                </nav>

                <div class="hidden items-center gap-4 lg:flex">
                    <button
                        class="relative rounded-full border border-emerald-200 p-2 text-green-600 transition hover:border-green-500 hover:text-green-900"
                        @click="togglePanel('cart')">
                        <span class="sr-only">Զամբյուղ</span>
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M3 3h2l.4 2M7 13h10l3-8H5.4M7 13L5.4 5M7 13l-2 9m12-9l2 9" />
                        </svg>
                        <span x-show="cart.length" x-text="cart.length" x-cloak
                            class="pointer-events-none absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full bg-green-500 text-[10px] font-semibold text-white"></span>
                    </button>
                </div>

                <div class="flex items-center gap-3 lg:hidden">
                    <button class="relative rounded-full border border-emerald-200 p-2 text-green-600 transition"
                        @click="togglePanel('cart')">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M3 3h2l.4 2M7 13h10l3-8H5.4M7 13L5.4 5M7 13l-2 9m12-9l2 9" />
                        </svg>
                        <span x-show="cart.length" x-text="cart.length" x-cloak
                            class="pointer-events-none absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full bg-green-500 text-[10px] font-semibold text-white"></span>
                    </button>
                </div>
            </div>
        </header>

        <main class="relative z-10">
            <section x-show="isRoute('catalog')" x-transition:enter="transition ease-out duration-500"
                x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
                x-cloak class="mx-auto max-w-7xl px-6 max-sm:px-2 py-16">
                <div class="flex flex-col gap-12">
                    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
                        <div class="space-y-4">
                            <p
                                class="text-sm uppercase p-3 bg-gradient-to-r from-green-500 to-emerald-500 w-max rounded-full text-white tracking-[0.3em]">
                                ՍԱԼԱՏՆԵՐ ԵՎ ԹԱՂԱԴՐՈՒԹՅՈՒՆ</p>
                            <h2 class="text-3xl font-semibold text-green-800">Թարմ եւ առողջ սալաթներ</h2>
                            <p class="text-lg text-green-600">Բալանսավորված համեր, արագ առաքում և գեղեցիկ ծառայություն
                                Երևանում։</p>
                        </div>
                        <div class="grid gap-4 md:grid-cols-2">
                            <label
                                class="flex items-center gap-3 h-[40px] rounded-2xl border border-emerald-300 bg-white px-4 py-2 text-sm text-green-700">
                                <svg class="h-4 w-4 text-green-500" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path d="m21 21-5.2-5.2M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14z" />
                                </svg>
                                <input type="search" placeholder="Որոնել սալաթներ"
                                    class="w-full border-0 bg-transparent text-[16px] placeholder:text-green-500 focus:ring-0"
                                    x-model="filters.search" />
                            </label>
                            <div class="grid w-full grid-cols-1 gap-3">
                                <select x-model="filters.category"
                                    class="rounded-2xl border border-emerald-300 bg-white px-4 py-2 text-sm text-green-700">
                                    <option value="all">Բոլոր տեսակները</option>
                                    <template x-for="category in categories" :key="category">
                                        <option :value="category" x-text="category"></option>
                                    </template>
                                </select>
                                <select x-model="filters.price"
                                    class="rounded-2xl border border-emerald-300 bg-white px-4 py-2 text-sm text-green-700">
                                    <option value="all">Ցանկացած գին</option>
                                    <option value="premium">Պրեմիում (5000+)</option>
                                    <option value="mid">Միջին (2000-5000)</option>
                                    <option value="budget">Մատչելի (2000-)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 max-sm:gap-2 md:grid-cols-2 xl:grid-cols-3">
                        <template x-for="(product, index) in filteredProducts" :key="product.id">
                            <article
                                class="group flex flex-col rounded-3xl max-md:rounded-2xl border border-green-200 bg-white p-5 max-sm:p-1 transition-all duration-300 hover:-translate-y-1 hover:border-green-500/60 hover:bg-green-50"
                                x-transition:enter="transition ease-out duration-500"
                                x-transition:enter-start="opacity-0 translate-y-4"
                                x-transition:enter-end="opacity-100 translate-y-0">
                                <div class="relative overflow-hidden bg-white rounded-2xl border border-rose-200">
                                    <img :src="product.image" :alt="product.name"
                                        class="h-56 max-sm:h-[150px] size-full object-cover transition duration-500 group-hover:scale-105"
                                        loading="lazy" />
                                    <span
                                        class="absolute left-3 top-3 rounded-full bg-white/80 px-3 py-1 text-xs font-semibold text-pink-600"
                                        x-text="product.category"></span>
                                </div>
                                <div class="flex flex-1 flex-col gap-4 py-5 max-sm:p-2 max-sm:gap-2">
                                    <div class="space-y-1">
                                        <h3 class="text-xl max-sm:text-sm font-semibold text-green-900"
                                            x-text="product.name"></h3>
                                    </div>
                                    <ul class="space-y-1 text-sm text-pink-600 max-sm:hidden">
                                        <template x-for="spec in product.specs" :key="spec">
                                            <li class="flex items-center">
                                                <span class="h-1 w-1 rounded-full bg-bgeen-500 mr-2"></span>
                                                <span x-text="spec"></span>
                                            </li>
                                        </template>
                                    </ul>
                                    <div
                                        class="mt-auto w-full flex items-center max-sm:gap-3 justify-between max-sm:flex-col max-sm:items-start">
                                        <div>
                                            <p class="text-xs uppercase tracking-widest text-green-500">Գին</p>
                                            <p class="text-[18px] font-semibold text-green-900"
                                                x-text="formatCurrency(product.price)"></p>
                                        </div>
                                        <div class="flex gap-3 max-sm:gap-1">
                                            <button
                                                class="rounded-2xl border bg-gradient-to-r from-green-300 to-green-500 text-white px-3 py-2 text-sm font-semibold transition hover:border-pink-500"
                                                @click="viewProduct(product)">
                                                Մանրամասն
                                            </button>
                                            <button
                                                class="rounded-full bg-gradient-to-r from-green-300 to-green-500 text-white border border-green-300 w-[40px] h-[40px] flex justify-center items-center px-4 py-2 text-sm font-semibold transition hover:bg-green-600"
                                                @click="addToCart(product)">
                                                <i class="fa-solid fa-cart-shopping"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        </template>
                    </div>
                </div>
            </section>

            <section x-show="isRoute('product')" x-transition x-cloak class="mx-auto max-w-6xl px-6 py-16">
                <div class="mb-8"><button
                        class="flex items-center lg:hidden gap-2 text-white py-2 px-3 rounded-full bg-gradient-to-r from-green-500 to-emerald-500"
                        @click="navigate('catalog')">← Վերադառնալ</button></div>
                <div x-show="selectedProduct" class="grid gap-12 lg:grid-cols-2">
                    <div class="space-y-6">
                        <div class="overflow-hidden rounded-3xl border border-emerald-200"><img
                                :src="selectedProduct?.image" :alt="selectedProduct?.name"
                                class="h-96 w-full object-cover bg-white" /></div>
                        <div class="grid gap-2 grid-cols-2"><template
                                x-for="(feature, index) in selectedProduct?.highlights" :key="index">
                                <div class="bg-green-50 rounded-xl p-3">
                                    <p class="text-xs uppercase tracking-widest text-green-600" x-text="feature.label">
                                    </p>
                                    <p class="text-lg font-semibold text-green-900" x-text="feature.value"></p>
                                </div>
                            </template></div>
                    </div>
                    <div class="space-y-8 px-3">
                        <div class="space-y-4">
                            <p class="text-sm uppercase tracking-[0.3em] text-green-600"
                                x-text="selectedProduct?.category"></p>
                            <h2 class="text-4xl font-semibold text-green-900" x-text="selectedProduct?.name"></h2>
                            <p class="text-lg text-green-600" x-text="selectedProduct?.description"></p>
                        </div>
                        <div class="rounded-3xl border border-emerald-200 bg-green-50 p-6">
                            <p class="text-sm uppercase tracking-widest text-green-500">Ապրանքի գին</p>
                            <p class="text-4xl font-semibold text-green-900"
                                x-text="formatCurrency(selectedProduct?.price)"></p>
                            <div class="mt-6"><button
                                    class="w-full rounded-2xl bg-gradient-to-r from-green-500 to-emerald-500 px-6 py-3 text-sm font-semibold text-white"
                                    @click="addToCart(selectedProduct)">Ավելացնել զամբյուղում</button></div>
                        </div>
                        <div class="rounded-3xl border border-emerald-200 bg-white p-6">
                            <h3 class="text-lg font-semibold text-green-900 mb-4">Բաղադրություն</h3>
                            <ul class="space-y-2"><template x-for="ingredient in selectedProduct?.bundle"
                                    :key="ingredient">
                                    <li class="flex items-center gap-2"><span
                                            class="h-1.5 w-1.5 rounded-full bg-green-500"></span><span
                                            class="text-green-700" x-text="ingredient"></span></li>
                                </template></ul>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <template x-teleport="body">
            <div x-show="panelOpen" x-transition.opacity x-cloak
                class="fixed inset-0 z-40 bg-green-900/10 backdrop-blur-sm" @click="closePanel()"></div>
        </template>

        <aside x-cloak x-show="panelName === 'cart'" x-transition
            class="fixed right-0 top-0 z-50 flex h-full w-full max-w-md flex-col border-l border-emerald-200 bg-white/95 backdrop-blur">
            <div class="flex items-center justify-between border-b border-emerald-200 px-6 py-4">
                <div>
                    <p class="text-lg font-semibold text-green-900">Զամբյուղ</p>
                    <p class="text-sm text-green-600" x-text="cart.length ? cart.length + ' դիրք' : 'Դեռ դատարկ է'"></p>
                </div><button class="text-green-600" @click="closePanel()">Փակել</button>
            </div>
            <div class="flex-1 space-y-4 overflow-y-auto px-6 py-6"><template x-if="!cart.length">
                    <p class="text-sm text-green-600">Ավելացրեք ապրանքներ տեսականիից՝ պատվեր կատարելու համար:</p>
                </template>
                <template x-for="item in cart" :key="item.id">
                    <div class="rounded-2xl border border-emerald-200 bg-green-50 p-4">
                        <div class="flex gap-4"><img :src="item.image" :alt="item.name"
                                class="h-20 w-20 rounded-xl object-contain bg-white p-2" />
                            <div class="flex-1">
                                <div class="flex items-center justify-between">
                                    <p class="font-semibold text-green-900" x-text="item.name"></p><button
                                        class="text-xs text-green-600 hover:text-green-900"
                                        @click="removeFromCart(item.id)">Հեռացնել</button>
                                </div>
                                <p class="text-sm text-green-600" x-text="item.category"></p>
                                <div class="mt-3 flex items-center justify-between text-sm">
                                    <div class="flex items-center gap-3"><button
                                            class="rounded-full text-xl flex justify-center items-center w-[40px] h-[40px] border border-emerald-300"
                                            @click="decrementQty(item.id)">−</button><span class="text-green-700"
                                            x-text="item.qty"></span><button
                                            class="rounded-full text-xl flex justify-center items-center w-[40px] h-[40px] border border-emerald-300"
                                            @click="incrementQty(item.id)">+</button></div>
                                    <p class="font-semibold text-green-900"
                                        x-text="formatCurrency(item.price * item.qty)"></p>
                                </div>
                            </div>
                        </div>
                </template>
            </div>
            <div class="border-t border-emerald-200 p-6">
                <div class="flex items-center justify-between text-sm text-green-600"><span>Ընդհանուր</span><span
                        class="text-xl font-semibold text-green-900" x-text="formatCurrency(cartTotal)"></span></div>
                <div class="mt-4 space-y-3"><button
                        class="w-full rounded-2xl bg-gradient-to-r from-green-500 to-emerald-500 px-6 py-3 text-sm font-semibold text-white"
                        :disabled="!cart.length" @click="openOrderForm()">Անցնել պատվերի</button><button
                        class="w-full rounded-2xl border border-green-500 px-6 py-3 text-sm font-semibold text-green-500"
                        :disabled="!cart.length" @click="closePanel()">Շարունակել գնումները</button></div>
            </div>
        </aside>

        <div x-cloak x-show="panelName === 'order'" x-transition x-cloak
            class="fixed inset-0 z-50 grid place-items-center">
            <div class="absolute inset-0 bg-black/40" @click="closePanel()"></div>
            <div class="relative w-full max-w-2xl rounded-3xl bg-white p-8">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-green-900">Պատվերի մանրամասներ</h3><button
                        class="text-green-600" @click="closePanel()">Փակել</button>
                </div>
                <div class="mt-6 grid gap-4">
                    <div><label class="text-sm text-green-600">Անուն</label><input x-model="orderForm.customerInfo.name"
                            type="text" class="w-full rounded-2xl border border-emerald-200 px-4 py-2" /></div>
                    <div class="grid grid-cols-2 gap-4 max-sm:grid-cols-1">
                        <div><label class="text-sm text-green-600">Հեռախոս</label><input
                                x-model="orderForm.customerInfo.phone" type="text"
                                class="w-full rounded-2xl border border-emerald-200 px-4 py-2" /></div>
                        <div><label class="text-sm text-green-600">Հասցե</label><input
                                x-model="orderForm.customerInfo.address" type="text"
                                class="w-full rounded-2xl border border-emerald-200 px-4 py-2" /></div>
                    </div>
                    <div class="flex gap-3"><label class="flex items-center gap-2"><input type="radio" value="pickup"
                                x-model="orderForm.deliveryOption" /><span class="text-sm text-green-600">Ստանալ
                                առաքմամբ</span></label><label class="flex items-center gap-2"><input type="radio"
                                value="delivery" x-model="orderForm.deliveryOption" /><span
                                class="text-sm text-green-600">Առաքում</span></label></div>
                    <div><label class="text-sm text-green-600">Մեկնաբանություն</label><textarea
                            x-model="orderForm.notes"
                            class="w-full rounded-2xl border border-emerald-200 px-4 py-2"></textarea></div>
                    <div class="mt-4 flex gap-3"><button class="rounded-2xl bg-green-500 px-6 py-3 text-white"
                            @click="submitOrder()">Ընդունել պատվերը</button><button
                            class="rounded-2xl border border-emerald-200 px-6 py-3"
                            @click="closePanel()">Չեղարկել</button></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        'use strict';

        class StorageService {
            static getItem(key) {
                try {
                    return JSON.parse(localStorage.getItem(key));
                } catch (e) {
                    return null;
                }
            }
            static setItem(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
            }
        }

        class CurrencyFormatter {
            static format(amount) {
                return new Intl.NumberFormat('hy', {
                    style: 'currency',
                    currency: 'AMD',
                    maximumFractionDigits: 0
                }).format(amount);
            }
        }

        class Product {
            constructor(id, name, category, price, badge, priceSegment, image, specs, highlights, bundle, description) {
                this.id = id;
                this.name = name;
                this.category = category;
                this.price = price;
                this.badge = badge;
                this.priceSegment = priceSegment;
                this.image = image;
                this.specs = specs || [];
                this.highlights = highlights || [];
                this.bundle = bundle || [];
                this.description = description || '';
            }
        }

        class CartItem extends Product {
            constructor(product, qty = 1) {
                super(
                    product.id,
                    product.name,
                    product.category,
                    product.price,
                    product.badge,
                    product.priceSegment,
                    product.image,
                    product.specs,
                    product.highlights,
                    product.bundle,
                    product.description
                );
                this.qty = qty;
            }

            get totalPrice() {
                return this.price * this.qty;
            }

            incrementQty() {
                this.qty += 1;
            }

            decrementQty() {
                if (this.qty > 1) {
                    this.qty -= 1;
                    return true;
                }
                return false;
            }
        }

        class OrderItem {
            constructor(product, quantity) {
                this.id = product.id;
                this.name = product.name;
                this.category = product.category;
                this.price = product.price;
                this.image = product.image;
                this.quantity = quantity;
            }

            get totalPrice() {
                return this.price * this.quantity;
            }
        }

        class Order {
            constructor(customerInfo) {
                this._orderId = this._generateOrderId();
                this._items = [];
                this._deliveryCost = 0;
                this._discount = 0;
                this._taxRate = 0.1;
                this._status = 'pending';
                this.customer = customerInfo;
                this.createdAt = new Date();
                this.updatedAt = new Date();
                this.subtotal = 0;
                this.tax = 0;
                this.discountAmount = 0;
                this.total = 0;
            }

            _generateOrderId() {
                const date = new Date();
                const timestamp = date.getTime();
                const random = Math.random().toString(36).substr(2, 6).toUpperCase();
                return `SALAD-${timestamp.toString().slice(-6)}-${random}`;
            }

            _calculateTotals() {
                const subtotal = this._items.reduce((sum, item) => sum + item.totalPrice, 0);
                const tax = subtotal * this._taxRate;
                const discountAmount = subtotal * (this._discount / 100);
                this.subtotal = subtotal;
                this.tax = tax;
                this.discountAmount = discountAmount;
                this.total = subtotal + tax - discountAmount + this._deliveryCost;
                return this.total;
            }

            addItem(product, quantity = 1) {
                const existing = this._items.find(i => i.id === product.id);
                if (existing) {
                    existing.quantity += quantity;
                } else {
                    this._items.push(new OrderItem(product, quantity));
                }
                this._calculateTotals();
                this.updatedAt = new Date();
            }

            removeItem(productId) {
                this._items = this._items.filter(i => i.id !== productId);
                this._calculateTotals();
                this.updatedAt = new Date();
            }

            updateQuantity(productId, newQuantity) {
                const item = this._items.find(i => i.id === productId);
                if (item) {
                    item.quantity = newQuantity;
                    this._calculateTotals();
                    this.updatedAt = new Date();
                }
            }

            applyDiscount(code) {
                const valid = { 'SALAD10': 10, 'HEALTH15': 15 };
                if (valid[code]) {
                    this._discount = valid[code];
                    this.discountCode = code;
                    this._calculateTotals();
                    return true;
                }
                return false;
            }

            setDeliveryCost(cost) {
                this._deliveryCost = cost;
                this._calculateTotals();
            }

            setStatus(newStatus) {
                const valid = ['pending', 'processing', 'preparing', 'delivering', 'delivered', 'cancelled'];
                if (valid.includes(newStatus)) {
                    this._status = newStatus;
                    this.updatedAt = new Date();
                    return true;
                }
                return false;
            }

            get orderId() { return this._orderId; }
            get items() { return [...this._items]; }
            get itemCount() { return this._items.reduce((t, i) => t + i.quantity, 0); }
            get status() { return this._status; }
            get deliveryCost() { return this._deliveryCost; }
            get discount() { return this._discount; }

            toJSON() {
                return {
                    orderId: this._orderId,
                    customer: this.customer,
                    items: this._items,
                    itemCount: this.itemCount,
                    subtotal: this.subtotal,
                    tax: this.tax,
                    discount: this._discount,
                    discountAmount: this.discountAmount,
                    deliveryCost: this._deliveryCost,
                    total: this.total,
                    status: this._status,
                    createdAt: this.createdAt,
                    updatedAt: this.updatedAt,
                    discountCode: this.discountCode,
                    notes: this.notes
                };
            }

            static fromJSON(data) {
                const o = new Order(data.customer);
                o._orderId = data.orderId;
                o._items = data.items || [];
                o._deliveryCost = data.deliveryCost || 0;
                o._discount = data.discount || 0;
                o._status = data.status || 'pending';
                o._taxRate = 0.1;
                o.createdAt = new Date(data.createdAt);
                o.updatedAt = new Date(data.updatedAt);
                o.subtotal = data.subtotal || 0;
                o.tax = data.tax || 0;
                o.discountAmount = data.discountAmount || 0;
                o.total = data.total || 0;
                o.discountCode = data.discountCode;
                o.notes = data.notes;
                return o;
            }
        }

        class OrderManager {
            constructor() {
                this.orders = [];
                this.currentOrder = null;
                this.loadOrders();
            }

            loadOrders() {
                try {
                    const saved = localStorage.getItem('salad_orders');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        this.orders = parsed.map(d => Order.fromJSON(d));
                    }
                } catch (e) {
                    console.error('Error loading orders', e);
                    this.orders = [];
                }
            }

            saveOrders() {
                try {
                    localStorage.setItem('salad_orders', JSON.stringify(this.orders));
                } catch (e) {
                    console.error('Error saving orders', e);
                }
            }

            createNewOrder(customerInfo) {
                this.currentOrder = new Order(customerInfo);
                return this.currentOrder;
            }

            getCurrentOrder() { return this.currentOrder; }

            completeCurrentOrder() {
                if (this.currentOrder) {
                    this.currentOrder.setStatus('processing');
                    this.orders.push(this.currentOrder);
                    this.saveOrders();
                    const completed = this.currentOrder;
                    this.currentOrder = null;
                    return completed;
                }
                return null;
            }

            cancelCurrentOrder() {
                if (this.currentOrder) {
                    this.currentOrder.setStatus('cancelled');
                    this.currentOrder = null;
                }
            }

            getAllOrders() { return [...this.orders]; }

            getOrderById(id) { return this.orders.find(o => o.orderId === id); }

            getUserOrders(email) {
                return this.orders
                    .filter(o => o.customer && o.customer.email === email)
                    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }
        }

        class ProductFilter {
            constructor(products) {
                this.products = products;
                this.filters = { search: '', category: 'all', price: 'all' };
            }

            setFilters(filters) {
                this.filters = { ...this.filters, ...filters };
            }

            apply() {
                return this.products.filter(product => {
                    const byCategory = this.filters.category === 'all' || product.category === this.filters.category;
                    const bySearch = !this.filters.search ||
                        product.name.toLowerCase().includes(this.filters.search.toLowerCase()) ||
                        product.category.toLowerCase().includes(this.filters.search.toLowerCase());
                    const byPrice = this.filters.price === 'all' || product.priceSegment === this.filters.price;
                    return byCategory && bySearch && byPrice;
                });
            }

            getCategories() {
                return [...new Set(this.products.map(i => i.category))];
            }
        }

                    { id: 6, name: 'Սեզամ սալաթ', category: 'Առողջ', price: 2800, badge: 'Սեզամով ու նուշով', priceSegment: 'mid', image: './salate6.jpg', specs: ['300 գ', 'Նուշ', 'Սեզամ'], highlights: [{ label: 'Քաշը', value: '300 գ' }, { label: 'Պահպանում', value: 'Սառնարանում' }, { label: 'Ժամկետ', value: '48 ժամ' }, { label: 'Նշում', value: 'Հարմար նուրբ սալաթ' }], bundle: ['Նուշ', 'Սեզամ', 'Բանջարեղեն'], description: 'Բալանսավորված սեզամային սալթ' }

            initializeCommunityStories() { return []; }

            init() {
                this.syncState();
                window.scrollTo(0, 0);
            }

            syncState() {
                const storedCart = StorageService.getItem('salad_cart');
                const storedWish = StorageService.getItem('salad_wishlist');
                if (storedCart) {
                    this.cart = storedCart.map(item => new CartItem(item, item.qty));
                }
                if (storedWish) {
                    this.wishlist = storedWish.map(p => new Product(p.id, p.name, p.category, p.price, p.badge, p.priceSegment, p.image, p.specs, p.highlights, p.bundle, p.description));
                }
            }

            persistState() {
                StorageService.setItem('salad_cart', this.cart);
                StorageService.setItem('salad_wishlist', this.wishlist);
            }

            navigate(route) {
                this.currentRoute = route;
                if (route !== 'product') this.selectedProduct = null;
                this.mobileMenu = false;
                window.scrollTo(0, 0);
            }

            isRoute(route) { return this.currentRoute === route; }
            formatCurrency(amount) { return CurrencyFormatter.format(amount); }

            get filteredProducts() { return this.productFilter.apply(); }
            get categories() { return this.productFilter.getCategories(); }
            get filters() { return this.productFilter.filters; }
            set filters(newFilters) { this.productFilter.setFilters(newFilters); }

            viewProduct(product) {
                this.selectedProduct = product;
                this.currentRoute = 'product';
                window.scrollTo(0, 0);
            }

            addToCart(product) {
                if (!product) return;
                const existing = this.cart.find(i => i.id === product.id);
                if (existing) {
                    existing.incrementQty();
                } else {
                    this.cart.push(new CartItem(product));
                }
                this.persistState();
                this.panelName = 'cart';
                this.panelOpen = true;
            }

            removeFromCart(id) {
                this.cart = this.cart.filter(i => i.id !== id);
                this.persistState();
            }

            incrementQty(id) {
                const item = this.cart.find(i => i.id === id);
                if (item) {
                    item.incrementQty();
                    this.persistState();
                }
            }

            decrementQty(id) {
                const item = this.cart.find(i => i.id === id);
                if (item) {
                    const ok = item.decrementQty();
                    if (!ok) {
                        this.removeFromCart(id);
                    } else {
                        this.persistState();
                    }
                }
            }

            toggleWishlist(product) {
                if (!product) return;
                if (this.isInWishlist(product.id)) {
                    this.wishlist = this.wishlist.filter(i => i.id !== product.id);
                } else {
                    this.wishlist.push(product);
                }
                this.persistState();
            }

            isInWishlist(id) { return this.wishlist.some(i => i.id === id); }

            togglePanel(name) {
                if (this.panelName === name && this.panelOpen) {
                    this.closePanel();
                    return;
                }
                this.panelName = name;
                this.panelOpen = true;
            }

            closePanel() {
                this.panelOpen = false;
                this.panelName = '';
                this.mobileMenu = false;
                this.orderSuccess = false;
                this.currentOrderDetails = null;
            }

            get cartTotal() { return this.cart.reduce((s, i) => s + i.totalPrice, 0); }

            openOrderForm() {
                if (this.cart.length === 0) {
                    alert('Զամբյուղը դատարկ է։ Ավելացրեք ապրանքներ պատվիրելու համար։');
                    return;
                }
                this.orderManager.createNewOrder({});
                this.orderForm.step = 1;
                this.orderSuccess = false;
                this.currentOrderDetails = null;
                this.panelName = 'order';
                this.panelOpen = true;
            }

            nextOrderStep() {
                if (this.orderForm.step < 4) {
                    if (this.validateCurrentStep()) {
                        this.orderForm.step++;
                    }
                }
            }

            prevOrderStep() { if (this.orderForm.step > 1) { this.orderForm.step--; } }

            validateCurrentStep() {
                const { step, customerInfo } = this.orderForm;
                if (step === 1) {
                    if (!customerInfo.name || !customerInfo.name.trim()) { alert('Խնդրում ենք նշել ձեր անունը'); return false; }
                    if (!customerInfo.phone || !customerInfo.phone.trim()) { alert('Խնդրում ենք նշել հեռախոսահամարը'); return false; }
                    if (this.orderForm.deliveryOption === 'delivery' && (!customerInfo.address || !customerInfo.address.trim())) { alert('Խնդրում ենք նշել հասցեն'); return false; }
                }
                if (step === 3 && this.orderForm.paymentMethod === 'card') {
                    const { cardDetails } = this.orderForm;
                    if (!this.validateCardDetails(cardDetails)) { alert('Խնդրում ենք նշել վավեր քարտի տվյալներ'); return false; }
                }
                return true;
            }

            validateCardDetails(cardDetails) {
                const { number, expiry, cvc } = cardDetails;
                if (!number || number.replace(/\D/g, '').length < 16) return false;
                if (!expiry || !/\d{2}\/\d{2}/.test(expiry)) return false;
                if (!cvc || cvc.length < 3) return false;
                return true;
            }

            calculateDeliveryPrice() {
                if (this.orderForm.deliveryOption === 'pickup') return 0;
                const zone = this.deliveryZones[this.orderForm.deliveryZone];
                if (!zone) return 0;
                let price = zone.price;
                const cartTotal = this.cartTotal;
                if (cartTotal >= 5000) return 0;
                if (cartTotal >= 3000) price = price * 0.5;
                return Math.round(price);
            }

            applyDiscountCode(code) {
                const order = this.orderManager.getCurrentOrder();
                if (order && code) {
                    const success = order.applyDiscount(code.toUpperCase());
                    if (success) {
                        this.discountCode = '';
                        alert('Զեղչը հաջողությամբ կիրառված է');
                    } else {
                        alert('Անվավեր զեղչի կոդ');
                    }
                    return success;
                }
                return false;
            }

            get orderSummary() {
                const order = this.orderManager.getCurrentOrder();
                if (!order) return null;
                const deliveryCost = this.calculateDeliveryPrice();
                const estimatedTime = this.orderForm.deliveryOption === 'delivery'
                    ? (this.deliveryZones[this.orderForm.deliveryZone]?.time || '60 րոպե')
                    : '30 րոպե';
                const subtotal = this.cartTotal;
                const discount = order.discount || 0;
                const discountAmount = subtotal * (discount / 100);
                const total = subtotal + deliveryCost - discountAmount;
                return {
                    items: this.cart,
                    itemCount: this.cart.reduce((s, i) => s + i.qty, 0),
                    subtotal: subtotal,
                    delivery: deliveryCost,
                    discount: discount,
                    discountAmount: discountAmount,
                    total: total,
                    estimatedTime: estimatedTime
                };
            }

            completeOrder() {
                if (!this.validateCurrentStep()) return false;
                const order = this.orderManager.getCurrentOrder();
                if (!order) { alert('Պատվերը չի գտնվել'); return false; }
                order.customer = { ...this.orderForm.customerInfo };
                this.cart.forEach(cartItem => {
                    const product = this.products.find(p => p.id === cartItem.id);
                    if (product) order.addItem(product, cartItem.qty);
                });
                const deliveryCost = this.calculateDeliveryPrice();
                order.setDeliveryCost(deliveryCost);
                if (this.orderForm.notes) order.notes = this.orderForm.notes;
                const completed = this.orderManager.completeCurrentOrder();
                if (completed) {
                    this.saveOrderToHistory(completed);
                    this.cart = [];
                    this.persistState();
                    this.currentOrderDetails = completed.toJSON();
                    this.orderSuccess = true;
                    this.orderForm.step = 4;
                    return true;
                }
                return false;
            }

            submitOrder() {
                if (this.completeOrder()) {
                    alert('Պատվերը հաջողությամբ ընդունվեց։ Շնորհակալություն։');
                    this.closePanel();
                    return true;
                }
                return false;
            }

            saveOrderToHistory(order) {
                const orderHistory = StorageService.getItem('order_history') || [];
                orderHistory.push({
                    orderId: order.orderId,
                    date: new Date().toISOString(),
                    total: order.total,
                    itemCount: order.itemCount,
                    status: order.status
                });
                if (orderHistory.length > 50) orderHistory.shift();
                StorageService.setItem('order_history', orderHistory);
            }

            get orderHistory() { return this.orderManager.getAllOrders(); }

            get previousOrders() {
                const email = this.orderForm.customerInfo.email;
                if (email) return this.orderManager.getUserOrders(email);
                return [];
            }
        }

        function shopApp() { return new ShopApplication(); }
    </script>
